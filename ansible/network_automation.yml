---
# Network Automation - Ansible Playbook
#
# Usage:
#   ansible-playbook -i inventory.yml network_automation.yml --tags=auto
#   ansible-playbook -i inventory.yml network_automation.yml --tags=show
#   ansible-playbook -i inventory.yml network_automation.yml --tags=change -e "target_device=RAN target_interface=backhaul0 target_ip=10.2.1.1 target_prefix=30"

- name: Network Automation
  hosts: devices
  gather_facts: false
  vars:
    # Default prefix length for point-to-point links.
    # Per-device IP assignments live in host_vars/<host>.yml as 'interface_ips'.
    default_prefix_length: 30

  tasks:
    # ===========================================
    # SHOW MODE - Display current configuration
    # ===========================================
    - name: "📋 Show Current Configuration"
      tags: [show, never]
      block:
        - name: "Get running configuration"
          ansible.netcommon.netconf_get:
            source: running
            display: json
            filter: |
              <interfaces xmlns="urn:ietf:params:xml:ns:yang:ietf-interfaces">
                <interface>
                  <name/>
                  <ipv4 xmlns="urn:ietf:params:xml:ns:yang:ietf-ip">
                    <address>
                      <ip/>
                      <prefix-length/>
                    </address>
                  </ipv4>
                </interface>
              </interfaces>
          register: device_config

        - name: "Display configuration status"
          debug:
            msg: |
              📱 {{ inventory_hostname }}:
              {% for iface in device_config.output.data.interfaces.interface %}
                 - {{ iface.name }}: {{ iface.ipv4.address.ip ~ '/' ~ iface.ipv4.address['prefix-length'] if iface.ipv4 is defined else 'no IP' }}
              {% endfor %}
      rescue:
        - name: "Report retrieval failure"
          debug:
            msg: "❌ Failed to retrieve configuration from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

    # ===========================================
    # AUTO MODE - Change all IPs
    # ===========================================
    - name: "🚀 Automatic IP Configuration"
      tags: [auto, never]
      block:
        - name: "Change IP addresses"
          ansible.netcommon.netconf_config:
            target: candidate
            commit: true
            save: true
            content: |
              <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
                <interfaces xmlns="urn:ietf:params:xml:ns:yang:ietf-interfaces">
                  {% for interface_name in device_interfaces %}
                  {% if interface_name in interface_ips %}
                  <interface>
                    <name>{{ interface_name }}</name>
                    <ipv4 xmlns="urn:ietf:params:xml:ns:yang:ietf-ip"
                          xmlns:nc="urn:ietf:params:xml:ns:netconf:base:1.0"
                          nc:operation="replace">
                      <enabled>true</enabled>
                      <address>
                        <ip>{{ interface_ips[interface_name].ip }}</ip>
                        <prefix-length>{{ interface_ips[interface_name].prefix }}</prefix-length>
                      </address>
                    </ipv4>
                  </interface>
                  {% endif %}
                  {% endfor %}
                </interfaces>
              </config>
          register: config_result

        - name: "Display result"
          debug:
            msg: |
              ✅ Successfully configured {{ inventory_hostname }}:
              {% for interface_name in device_interfaces %}
              {% if interface_name in interface_ips %}
                 - {{ interface_name }}: {{ interface_ips[interface_name].ip }}/{{ interface_ips[interface_name].prefix }}
              {% endif %}
              {% endfor %}
      rescue:
        - name: "Report configuration failure"
          fail:
            msg: "❌ Failed to configure {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

    # ===========================================
    # CHANGE MODE - Change specific interface
    # ===========================================
    - name: "🔧 Custom IP Configuration"
      tags: [change, never]
      when: 
        - target_device is defined
        - target_interface is defined
        - target_ip is defined
        - inventory_hostname == target_device
      block:
        - name: "Validate input parameters"
          assert:
            that:
              # Each octet constrained to 0-255 (rejects e.g. 999.0.0.1)
              - target_ip is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
              - target_prefix | default(30) | int <= 32
              - target_prefix | default(30) | int >= 0
            fail_msg: "Invalid IP address or prefix length"
            success_msg: "Input parameters validated"

        - name: "Change IP on {{ inventory_hostname }}:{{ target_interface }}"
          ansible.netcommon.netconf_config:
            target: candidate
            commit: true
            save: true
            content: |
              <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
                <interfaces xmlns="urn:ietf:params:xml:ns:yang:ietf-interfaces">
                  <interface>
                    <name>{{ target_interface }}</name>
                    <ipv4 xmlns="urn:ietf:params:xml:ns:yang:ietf-ip"
                          xmlns:nc="urn:ietf:params:xml:ns:netconf:base:1.0"
                          nc:operation="replace">
                      <enabled>true</enabled>
                      <address>
                        <ip>{{ target_ip }}</ip>
                        <prefix-length>{{ target_prefix | default(30) }}</prefix-length>
                      </address>
                    </ipv4>
                  </interface>
                </interfaces>
              </config>
          register: custom_config_result

        - name: "Display custom configuration result"
          debug:
            msg: |
              ✅ Successfully changed {{ inventory_hostname }}:{{ target_interface }} to {{ target_ip }}/{{ target_prefix | default(30) }}

# Post-run summary play - reads real state back from each device
- name: 📊 Configuration Summary
  hosts: devices
  gather_facts: false
  tags: [auto, never]
  tasks:
    - name: "Retrieve final running configuration"
      ansible.netcommon.netconf_get:
        source: running
        display: json
        filter: |
          <interfaces xmlns="urn:ietf:params:xml:ns:yang:ietf-interfaces">
            <interface>
              <name/>
              <ipv4 xmlns="urn:ietf:params:xml:ns:yang:ietf-ip">
                <address>
                  <ip/>
                  <prefix-length/>
                </address>
              </ipv4>
            </interface>
          </interfaces>
      register: final_config

    - name: "Show final configuration"
      debug:
        msg: |
          📱 {{ inventory_hostname }}:
          {% for iface in final_config.output.data.interfaces.interface %}
             - {{ iface.name }}: {{ iface.ipv4.address.ip ~ '/' ~ iface.ipv4.address['prefix-length'] if iface.ipv4 is defined else 'no IP' }}
          {% endfor %}
