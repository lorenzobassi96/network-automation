---
# Inventory file for backhaul network devices.
# Common connection settings are in group_vars/devices.yml.
# Only per-host values (port + interface list) are defined here.
all:
  children:
    devices:
      hosts:
        RAN:
          ansible_port: 830
          device_interfaces:
            - eth0
            - backhaul0

        Router:
          ansible_port: 831
          device_interfaces:
            - eth0
            - eth1
            - eth2

        Core:
          ansible_port: 832
          device_interfaces:
            - eth0
            - eth1
